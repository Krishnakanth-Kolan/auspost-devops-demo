name: CI - Test, Scan and Publish

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "terraform/**"
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Unit tests
        run: pytest

      - name: Static security scan
        run: bandit -r app -c pyproject.toml

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  build-scan-publish:
    runs-on: ubuntu-latest
    needs: test-and-scan-code
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          VERSION="sha-${GITHUB_SHA::12}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "local_image=auspost-devops-demo:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local_image }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.local_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the exact scanned artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          REMOTE="${{ secrets.DOCKERHUB_USERNAME }}/auspost-devops-demo"
          docker tag "${{ steps.meta.outputs.local_image }}" "$REMOTE:${{ steps.meta.outputs.version }}"
          docker tag "${{ steps.meta.outputs.local_image }}" "$REMOTE:latest"
          docker push "$REMOTE:${{ steps.meta.outputs.version }}"
          docker push "$REMOTE:latest"
